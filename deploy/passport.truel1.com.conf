# NEW site only — do not edit any existing nginx site file.
# This file goes to /etc/nginx/sites-available/passport.truel1.com
# Then: ln -s /etc/nginx/sites-available/passport.truel1.com /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name passport.truel1.com;
    root /var/www/passport.truel1.com;
    index index.html;

    # QR and passport URLs like /p/TRUE-SJ-001 serve the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets, cache briefly (demo)
    location ~* \.(png|css|js|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
